[package]
name = "eh3d-motioncnc"
version = "0.0.2"
edition = "2021"
description = "The EH3D machine-control program: drilling, routing and 2D and 3D CNC work (the view of a job so far)"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-MOTIONCNC"
readme = "README.md"

[dependencies]
eh3d-view = { path = "../EH3D-COMMON/crates/view" }

[profile.dev]
# a lighter debug build: the file and line of a panic stay, the full debug symbols (the bulk of the target folder) do not
debug = "line-tables-only"
