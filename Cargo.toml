[package]
name = "eh3d-motioncnc"
version = "0.0.3"
edition = "2021"
description = "The EH3D machine-control program: a window over a controller, a simulated one so far"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-MOTIONCNC"
readme = "README.md"

[features]
default = []
gui = ["dep:eframe", "dep:png"]
# GRBL on a real serial port
serial = ["eh3d-controller/serial"]

[dependencies]
eh3d-view = { path = "../EH3D-COMMON/crates/view" }
eh3d-controller = { path = "../EH3D-COMMON/crates/controller" }
eh3d-filedialog = { path = "../EH3D-COMMON/crates/filedialog" }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"], optional = true }
png = { version = "0.17", optional = true }

# the window of Linux needs a windowing system chosen at build time (X11 and Wayland); Windows and macOS have their own
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }

[[bin]]
name = "motioncnc"
path = "src/bin/motioncnc.rs"
required-features = ["gui"]

[profile.dev]
# a lighter debug build: the file and line of a panic stay, the full debug symbols (the bulk of the target folder) do not
debug = "line-tables-only"
